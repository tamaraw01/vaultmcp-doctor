[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultmcp-doctor"
version = "1.0.0"
description = "Read-only preflight and diagnostics CLI for Obsidian + Claude Code + MCP vaults."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vaultmcp-doctor = "vaultmcp_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
